name: Refresh live data

# Runs itself once a day, and on demand from the Actions tab.
#
# Daily rather than event-driven on purpose: there is no webhook for "you
# starred a repo" or "you pushed a commit", and polling more often would push
# a commit for nothing most of the time. A new star or a fresh line count
# shows up on the profile within a day, which is the resolution this data
# actually deserves.
on:
  schedule:
    - cron: "17 6 * * *"   # an arbitrary off-the-hour minute, not midnight —
                           # avoids the crowd of jobs everyone schedules at :00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch live data and rebuild
        run: |
          node src/livedata.mjs
          npm run build

      - name: Commit and push, only if something actually changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ README.md assets/
          git diff --cached --quiet || git commit -m "Refresh: starred repos, stats, line counts"
          git push
