<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="480" height="138" viewBox="0 0 480 138"
     role="img" aria-label="Saish Malunde — GitHub profile">
  <title>Saish Malunde — GitHub profile</title>
  <style>
  :root {
    --page: #FFFFFF;
    --bg: #F7FAFD;
    --surface: #FFFFFF;
    --border: #D7E1F0;
    --fg: #0F1726;
    --muted: #5B6B85;
    --accent: #E8A33D;
    --accent2: #3B6FD4;
    --barA: #A9C3E3;
    --barB: #7E9DC8;
    --band1: #F4F8FD;
    --band2: #DFE9F7;
    --band3: #EDF3FC;
    --band4: #D2E1F4;
    --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
    --font-serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0D1117;
      --bg: #0A0F1A;
      --surface: #16213A;
      --border: #25334D;
      --fg: #E8EEF8;
      --muted: #8496B4;
      --accent: #F0B455;
      --accent2: #6E9FEF;
      --barA: #2B4070;
      --barB: #1E2E52;
      --band1: #070C16;
      --band2: #121D33;
      --band3: #0A1220;
      --band4: #19294A;
    }
  }

  text { font-family: var(--font-sans) }
  .mono { font-family: var(--font-mono) }
  .serif { font-family: var(--font-serif) }

  </style>

  <rect x="0" y="0" width="480" height="138" fill="var(--band4)"/>
  <g transform="translate(0, 0)">
  <text x="16" y="20" font-size="14.9" font-weight="700" fill="var(--muted)" text-anchor="start" letter-spacing="2.5">GUESTBOOK</text>
  <text x="464" y="20" font-size="14.9" font-weight="400" fill="var(--muted)" text-anchor="end">1 signed</text>
  
  <circle cx="30" cy="52" r="13" fill="var(--accent)" opacity="0.25"/><text x="30" y="57" font-size="16.2" font-weight="700" fill="var(--accent)" text-anchor="middle">S</text><text x="54" y="51" font-size="17.6" font-weight="600" fill="var(--fg)" text-anchor="start">saishmalunde8</text><text x="54" y="68" font-size="16.2" font-weight="400" fill="var(--muted)" text-anchor="start">I love your Readme Page</text><text x="464" y="58" font-size="14.9" font-weight="400" fill="var(--muted)" text-anchor="end" class="mono">2026-08-11</text>
  <rect x="16" y="90" width="190" height="34" rx="17" fill="var(--accent)" opacity="0.9"/>
  <text x="111" y="112" font-size="17.6" font-weight="600" fill="var(--bg)" text-anchor="middle">✎  Sign the guestbook</text>
  <text x="222" y="112" font-size="14.9" font-weight="400" fill="var(--muted)" text-anchor="start">click anywhere in this band — it opens a pre-filled issue</text>
  </g>
</svg>
